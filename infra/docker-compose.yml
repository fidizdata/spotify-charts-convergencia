services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "spotify_charts"
    volumes:
      - "spotify_charts_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

  postgres_exporter:
      image: prometheuscommunity/postgres-exporter:latest
      environment:
        DATA_SOURCE_NAME: "postgresql://admin:admin@pgdatabase:5432/spotify_charts?sslmode=disable" # consultar 
      ports:
        - "9187:9187"
      depends_on:
        - pgdatabase

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus_data:/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - postgres_exporter

  grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      volumes:
        - "grafana_data:/var/lib/grafana"
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
      depends_on:
        - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  spotify_charts_postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data: